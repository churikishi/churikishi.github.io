<script>
const LESSONS = [{"date": "2026-10-13", "label": "13/10/2026", "title": "Hỏi khi chưa hiểu", "parts": ["Chào buổi sáng bạn ☀️ Hôm nay mình học cách hỏi khi chưa hiểu hướng dẫn, dùng được trong buổi đào tạo và lúc làm việc nhé.\n\n🇨🇳 TIẾNG TRUNG\n5 từ mới:\n• 说 (shuō): nói\n• 慢 (màn): chậm\n• 明白 (míngbai): hiểu\n• 问题 (wèntí): câu hỏi; vấn đề\n• 老师 (lǎoshī): giáo viên, thầy/cô\n\n5 câu thông dụng:\n1. 请说慢一点。\nQǐng shuō màn yì diǎn.\n→ Bạn vui lòng nói chậm hơn một chút.\n2. 请再说一遍。\nQǐng zài shuō yí biàn.\n→ Bạn vui lòng nói lại một lần nữa.\n3. 我不明白。\nWǒ bù míngbai.\n→ Mình chưa hiểu.\n4. 我有一个问题。\nWǒ yǒu yí ge wèntí.\n→ Mình có một câu hỏi.\n5. 我明白了。\nWǒ míngbai le.\n→ Mình hiểu rồi.\n\n💡 一 viết riêng là yī; trong các câu trên mình ghi yì/yí theo cách đọc khi ghép câu. Âm không dấu như bai, ge, le đọc nhẹ.\n\n🇬🇧 TIẾNG ANH\n5 từ mới (IPA giọng Mỹ):\n• speak /spiːk/: nói\n• slowly /ˈsloʊ.li/: một cách chậm rãi\n• again /əˈɡen/: lại, lần nữa\n• understand /ˌʌn.dɚˈstænd/: hiểu\n• question /ˈkwes.tʃən/: câu hỏi\n\n5 câu thông dụng:\n1. Please speak more slowly.\n/pliːz spiːk mɔːr ˈsloʊ.li/\n→ Bạn vui lòng nói chậm hơn.\n2. Could you say that again, please?\n/kʊd juː seɪ ðæt əˈɡen pliːz/\n→ Bạn có thể nói lại điều đó không?\n3. I don't understand.\n/aɪ doʊnt ˌʌn.dɚˈstænd/\n→ Mình chưa hiểu.\n4. I have a question.\n/aɪ hæv ə ˈkwes.tʃən/\n→ Mình có một câu hỏi.\n5. I understand now.\n/aɪ ˌʌn.dɚˈstænd naʊ/\n→ Bây giờ mình hiểu rồi.\n\n🌱 Bạn thử đọc câu số 2 ở mỗi phần 3 lần. Khi nghe chưa rõ, cứ hỏi lại nhé!\n\nNguồn: Cambridge Dictionary (speak, slowly, again, understand, question) https://dictionary.cambridge.org/dictionary/english/speak ; cụm tiếng Trung: https://english.shanghai.gov.cn/en-LearnChinese/20240620/19d99140f2a14bafb5c309968416aa0d.html", "🇨🇳 CÁCH ĐỌC TIẾNG TRUNG\nMình ghi số thanh sau mỗi âm để không nhầm với dấu tiếng Việt: 1 = cao, đều; 2 = đi lên (gần sắc); 3 = hạ thấp (gợi dấu hỏi); 4 = từ cao hạ nhanh; 0 = nhẹ, ngắn.\n\n5 từ:\n• 说 shuō: \"sua(1)\" = nói\n• 慢 màn: \"man(4)\" = chậm\n• 明白 míngbai: \"ming(2)-pai(0)\" = hiểu\n• 问题 wèntí: \"uân(4)-thi(2)\" = câu hỏi\n• 老师 lǎoshī: \"lao(3)-sư(1)\" = thầy/cô\n\n5 câu:\n1. Qǐng shuō màn yì diǎn → \"ching(3) sua(1) man(4) i(4) tiên(3)\"\n2. Qǐng zài shuō yí biàn → \"ching(3) tsai(4) sua(1) i(2) pien(4)\"\n3. Wǒ bù míngbai → \"uo(3) pu(4) ming(2)-pai(0)\"\n4. Wǒ yǒu yí ge wèntí → \"uo(2) iâu(3) i(2) cơ(0) uân(4)-thi(2)\" (wǒ đổi thành thanh 2 vì đứng trước yǒu cũng thanh 3)\n5. Wǒ míngbai le → \"uo(3) ming(2)-pai(0) lơ(0)\"\n\nÂm khó:\n• q (qǐng) gần \"ch\" nhưng bật hơi rõ, không đọc \"qu\"\n• sh (shuō, shī) cong đầu lưỡi ra sau; \"sư\" chỉ gợi âm shī\n• z (zài) gần \"ts\" liền một âm, không đọc \"d\"\n• d (diǎn) gần \"t\" không bật hơi; b (bù, biàn) gần \"p\" không bật hơi\n• bai, ge, le đọc nhẹ hơn âm đứng trước", "🇬🇧 CÁCH ĐỌC TIẾNG ANH\nChữ IN HOA là phần nhấn. Âm bồi chỉ gợi âm. Âm cuối k, d, t, s, z cần giữ, đừng thêm \"ờ\" sau chúng.\n\n5 từ:\n• speak: \"SPIIK\" = nói (kéo dài i, giữ k cuối)\n• slowly: \"SLÂU-li\" = chậm rãi\n• again: \"ờ-GHEN\" = lại\n• understand: \"ân-đờ-STENĐ\" = hiểu\n• question: \"QUÉS-chần\" = câu hỏi\n\n5 câu:\n1. Please speak more slowly → \"pliiz SPIIK mor SLÂU-li\"\n2. Could you say that again, please? → \"cud iu SÂY thát ờ-GHEN pliiz\"\n3. I don't understand → \"ai DÂUNT ân-đờ-STENĐ\"\n4. I have a question → \"ai hev ờ QUÉS-chần\"\n5. I understand now → \"ai ân-đờ-STENĐ NAU\"\n\nLưu ý:\n• \"th\" trong that: đặt nhẹ đầu lưỡi giữa hai hàm răng, đẩy hơi và rung cổ họng, không đọc \"th\" kiểu tiếng Việt\n• please kết thúc bằng âm z có rung cổ họng, không phải s chỉ có hơi\n• don't: giữ cả n và t cuối khi tập đọc chậm\n• \"have\": mở miệng rộng hơn \"hev\", môi dưới chạm nhẹ răng trên ở âm v cuối\n\nHôm nay bạn tập đúng hướng giọng của yì/yí và giữ âm cuối tiếng Anh trước nhé, không cần giống người bản xứ ngay.\n\nNguồn: University of Hawaii (thanh điệu, biến thanh 一, q/sh): https://laulima.hawaii.edu/access/content/group/613e6b40-7843-4d5c-94ca-41a9e0831b95/CBasic1/u1/u1_p1.html ; BBC (yi, shī, z): https://www.bbc.co.uk/bitesize/articles/zjm6hcw ; Cambridge (IPA, trọng âm): https://dictionary.cambridge.org/help/phonetics ; BBC Learning English (th): https://www.bbc.com/learningenglish/korean/features/the_pronunciation_lounge/episode_13\nCách ghi âm bồi là mình tự soạn để gợi âm, không phải phiên âm chuẩn được nguồn nào công nhận."]}, {"date": "2026-10-14", "label": "14/10/2026", "title": "Nước uống", "parts": ["Bài sáng 14/10: nước uống\n\nTIẾNG TRUNG\n\nCách đọc bằng chữ Việt chỉ gần đúng, không thay thế pinyin. Số trong ngoặc chỉ thanh: 1 = cao đều; 2 = lên; 3 = thấp, khi đọc riêng xuống rồi lên; 4 = hạ nhanh; 0 = nhẹ.\n\n5 từ mới\n• 水 shuǐ: nước\nGần đúng: suây(3)\n• 茶 chá: trà\nGần đúng: cha(2)\n• 咖啡 kāfēi: cà phê\nGần đúng: kha(1)-phây(1)\n• 杯子 bēizi: cốc, ly\nGần đúng: pây(1)-tsư(0)\n• 喝 hē: uống\nGần đúng: hơ(1)\n\n5 câu thông dụng\n1. 我想喝水。\nWǒ xiǎng hē shuǐ.\nGần đúng khi nói liền: uo(2) xiang(3) hơ(1) suây(3)\n→ Mình muốn uống nước.\n\n2. 您想喝什么？\nNín xiǎng hē shénme?\nGần đúng: nin(2) xiang(3) hơ(1) sân(2)-mơ(0)\n→ Anh/chị muốn uống gì?\n\n3. 请给我一杯茶。\nQǐng gěi wǒ yì bēi chá.\nGần đúng khi nói liền: ching(2) cẩy(2) uo(3) i(4) pây(1) cha(2)\n→ Cho mình một cốc trà nhé.\n\n4. 请喝茶。\nQǐng hē chá.\nGần đúng: ching(3) hơ(1) cha(2)\n→ Mời bạn uống trà.\n\n5. 我不喝咖啡。\nWǒ bù hē kāfēi.\nGần đúng: uo(3) pu(4) hơ(1) kha(1)-phây(1)\n→ Mình không uống cà phê.\n\nChú ý phát âm\n• Câu 1: wǒ đứng trước xiǎng, cùng thanh 3, nên wǒ đọc lên thành thanh 2. Pinyin vẫn giữ dấu gốc.\n• Câu 3: khi nói liền cụm 请给我, hai âm đầu thường đọc lên như hướng dẫn gần đúng.\n• 一杯 đọc yì bēi: âm “i” hạ nhanh, không thêm “d” thành “dị”.\n• sh trong shuǐ/shén hơi cong đầu lưỡi ra sau; x trong xiǎng có đầu lưỡi gần răng dưới. Không đồng nhất với s/x tiếng Việt.\n• ch trong chá bật hơi; b trong bēi gần “p” không bật hơi. zi trong bēizi đọc nhẹ, không thành “di”.\n\nNguồn mẫu từ/câu: ChineseClass101. Nguồn hướng dẫn phát âm: Đại học Hawaiʻi. Các câu luyện được biên soạn từ mẫu cơ bản; cách đọc bằng chữ Việt là gợi âm, không phải phiên âm chuẩn.\nhttps://www.chineseclass101.com/lesson/beginner-14-what-do-you-want-to-drink\nhttps://laulima.hawaii.edu/access/content/group/613e6b40-7843-4d5c-94ca-41a9e0831b95/CBasic1/u1/u1_p1.html", "TIẾNG ANH: nước uống\n\nPhiên âm dưới đây theo giọng Mỹ. Cách đọc chữ Việt chỉ gần đúng; phần viết hoa gợi phần nhấn, không đọc theo dấu thanh tiếng Việt.\n\n5 từ mới\n• water /ˈwɑː.t̬ɚ/: nước\nGần đúng: OA-đờ, âm sau có r nhẹ.\n• tea /tiː/: trà\nGần đúng: TII, kéo dài âm i.\n• coffee /ˈkɑː.fi/: cà phê\nGần đúng: KHA-fi.\n• cup /kʌp/: cốc, ly\nGần đúng: CÂP, giữ p cuối.\n• drink /drɪŋk/: uống\nGần đúng: ĐRINGK, i ngắn, giữ k cuối.\n\n5 câu thông dụng\n1. I'd like some water.\n/aɪd laɪk səm ˈwɑː.t̬ɚ/\nGần đúng: aid LAIK sầm OA-đờ\n→ Mình muốn một ít nước.\n\n2. Would you like tea or coffee?\n/wʊd juː laɪk tiː ɔːr ˈkɑː.fi/\nGần đúng: uđ iu laik TII or KHA-fi\n→ Bạn muốn trà hay cà phê?\n\n3. A cup of tea, please.\n/ə kʌp əv tiː pliːz/\nGần đúng: ờ CÂP ờv TII pliiz\n→ Cho mình một cốc trà nhé.\n\n4. This is my cup.\n/ðɪs ɪz maɪ kʌp/\nGần đúng: this iz mai CÂP\n→ Đây là cốc của mình.\n\n5. I drink water every day.\n/aɪ drɪŋk ˈwɑː.t̬ɚ ˈev.ri deɪ/\nGần đúng: ai đringk OA-đờ EV-ri ĐÂY\n→ Mình uống nước mỗi ngày.\n\nChú ý phát âm\n• Đừng thêm “ờ” vào cuối: cup không thành “cấp-pờ”, drink không thành “đờ-rinh-kờ”.\n• this bắt đầu bằng /ð/: đặt nhẹ đầu lưỡi giữa răng, đẩy hơi và rung cổ họng. Không đọc thành “th” tiếng Việt.\n• is và please kết thúc bằng /z/, có rung cổ họng; this kết thúc bằng /s/, chỉ có hơi.\n• OA-đờ gợi cách đọc water giọng Mỹ: t ở giữa lướt nhanh gần d, không phải d mạnh tiếng Việt.\n\nMình thử tập câu “Cho mình một cốc trà nhé” ở cả hai ngôn ngữ, mỗi câu 3 lần.\n\nNguồn đối chiếu từ và phát âm: Cambridge. Các câu luyện và cách đọc gần đúng do bạn biên soạn; phiên âm câu thể hiện cách đọc chậm, rõ.\nhttps://dictionary.cambridge.org/us/pronunciation/english/water\nhttps://dictionary.cambridge.org/us/pronunciation/english/tea\nhttps://dictionary.cambridge.org/us/dictionary/english/coffee\nhttps://dictionary.cambridge.org/pronunciation/english/cup\nhttps://dictionary.cambridge.org/us/pronunciation/english/drink\nhttps://dictionary.cambridge.org/help/phonetics"]}, {"date": "2026-10-16", "label": "16/10/2026", "title": "Dụng cụ vệ sinh", "parts": ["Bài sáng 16/10: dụng cụ vệ sinh\n\nTIẾNG TRUNG\n\nCách đọc chữ Việt chỉ gần đúng, không thay thế pinyin. Số trong ngoặc: 1 = cao đều; 2 = đi lên; 3 = thấp, đọc riêng xuống rồi lên; 4 = hạ nhanh; 0 = nhẹ. Dòng pinyin giữ thanh gốc, dòng gần đúng gợi cách nói liền.\n\n5 từ mới\n• 拖把 tuōbǎ: cây lau nhà\nGần đúng: thuo(1)-pa(3)\n• 水桶 shuǐtǒng: xô nước\nGần đúng khi nói liền: suây(2)-thung(3)\n• 抹布 mābù: khăn lau\nGần đúng: ma(1)-pu(4)\n• 手套 shǒutào: găng tay\nGần đúng: sâu(3)-thao(4)\n• 垃圾 lājī: rác\nGần đúng: la(1)-chi(1)\n\n5 câu thông dụng\n1. 拖把在哪里？\nTuōbǎ zài nǎlǐ?\nGần đúng: thuo(1)-pa(3) tsai(4) na(2)-li(3)\n→ Cây lau nhà ở đâu?\n\n2. 请给我一块抹布。\nQǐng gěi wǒ yí kuài mābù.\nGần đúng: ching(2) cẩy(2) uo(3) i(2) khoai(4) ma(1)-pu(4)\n→ Bạn cho mình một chiếc khăn lau nhé.\n\n3. 这是水桶。\nZhè shì shuǐtǒng.\nGần đúng: chơ(4) sư(4) suây(2)-thung(3)\n→ Đây là xô nước.\n\n4. 我需要手套。\nWǒ xūyào shǒutào.\nGần đúng: uo(3) xuy(1)-iao(4) sâu(3)-thao(4)\n→ Mình cần găng tay.\n\n5. 我去倒垃圾。\nWǒ qù dào lājī.\nGần đúng: uo(3) chuy(4) tao(4) la(1)-chi(1)\n→ Mình đi đổ rác.\n\nLưu ý phát âm\n• 水桶 và 哪里 có hai thanh 3 liền nhau: khi nói, âm đầu đổi sang thanh 2, đọc shuítǒng và nálǐ.\n• 请给我 có ba thanh 3; khi nói liền cụm, hai âm đầu thường đọc lên như phần gần đúng.\n• xū trong 需要 và qù trong 去 có nguyên âm ü dù pinyin viết u. Giữ lưỡi như nói “i”, tròn môi như nói “u”. Cách ghi xuy/chuy chỉ gợi âm, không tách thành hai âm.\n• q bật hơi, j không bật hơi; sh/zh hơi cong đầu lưỡi ra sau. jī trong 垃圾 không phải “gi” tiếng Việt.\n\nNguồn đối chiếu từ vựng: AllSet Learning, YellowBridge; phát âm: Đại học Hawaiʻi. Câu luyện và cách đọc gần đúng do bạn biên soạn.\nhttps://resources.allsetlearning.com/chinese/vocabulary/HSK_Cleaning_Vocabulary_List\nhttps://www.yellowbridge.com/chinese/dictionary.php?word=%E6%B0%B4%E6%A1%B6\nhttps://kotobank.jp/zhjaword/%E5%93%AA%E9%87%8C\nhttps://laulima.hawaii.edu/access/content/group/613e6b40-7843-4d5c-94ca-41a9e0831b95/CBasic1/u1/u1_p1.html", "TIẾNG ANH: dụng cụ vệ sinh\n\nPhiên âm theo giọng Mỹ. Chữ Việt chỉ gợi âm; phần viết hoa là phần nhấn, không áp dấu thanh tiếng Việt.\n\n5 từ mới\n• mop /mɑːp/: cây lau nhà; lau bằng cây lau\nGần đúng: MAAP, giữ p cuối.\n• bucket /ˈbʌk.ɪt/: xô\nGần đúng: BÂK-it.\n• cloth /klɑːθ/: khăn, miếng vải\nGần đúng: KLA-th, xem hướng dẫn âm cuối bên dưới.\n• glove /ɡlʌv/: một chiếc găng tay\nGần đúng: GLÂV, giữ v cuối.\n• trash /træʃ/: rác, cách dùng ở Mỹ\nGần đúng: TRA-sh, âm a mở rộng, gần giữa a và e.\n\n5 câu thông dụng\n1. Where is the mop?\n/wer ɪz ðə mɑːp/\nGần đúng: uer iz thờ MAAP\n→ Cây lau nhà ở đâu?\n\n2. Could you give me a cloth, please?\n/kʊd juː ɡɪv miː ə klɑːθ pliːz/\nGần đúng: cud iu GIV mii ờ KLA-th pliiz\n→ Bạn có thể cho mình một chiếc khăn lau không?\n\n3. This is a bucket.\n/ðɪs ɪz ə ˈbʌk.ɪt/\nGần đúng: this iz ờ BÂK-it\n→ Đây là một cái xô.\n\n4. I need gloves.\n/aɪ niːd ɡlʌvz/\nGần đúng: ai NIID GLÂVZ\n→ Mình cần găng tay.\n\n5. I'll take out the trash.\n/aɪl teɪk aʊt ðə træʃ/\nGần đúng: ail TÂYK AUT thờ TRA-sh\n→ Mình sẽ mang rác đi đổ.\n\nLưu ý phát âm\n• cloth kết thúc bằng /θ/: đầu lưỡi nhẹ giữa răng, thổi hơi, không rung cổ họng. the/this có /ð/, cùng vị trí lưỡi nhưng có rung. Không đọc như “th” tiếng Việt.\n• glove là một chiếc, gloves là nhiều chiếc. Giữ cụm /vz/ cuối: môi dưới chạm nhẹ răng trên cho /v/, rồi âm xì có rung cho /z/.\n• trash có /ʃ/ cuối, không đọc thành “trát”. Giữ p cuối mop, t cuối bucket; không thêm “ờ” sau âm cuối.\n\nMình thử chỉ vào một dụng cụ và nói câu “Đây là…” bằng cả hai ngôn ngữ nhé.\n\nNguồn từ và phát âm: Cambridge. Các câu là ví dụ biên soạn; phiên âm câu thể hiện cách đọc chậm, rõ.\nhttps://dictionary.cambridge.org/dictionary/english/mop\nhttps://dictionary.cambridge.org/us/dictionary/english/bucket\nhttps://dictionary.cambridge.org/pronunciation/english/cloth\nhttps://dictionary.cambridge.org/pronunciation/english/glove\nhttps://dictionary.cambridge.org/us/dictionary/english/trash\nhttps://dictionary.cambridge.org/help/phonetics"]}, {"date": "2026-10-21", "label": "21/10/2026", "title": "Thời gian và giờ làm việc", "parts": ["Bài sáng 21/10: Thời gian và giờ làm việc\n\nTIẾNG TRUNG\nCách đọc chữ Việt chỉ gần đúng, không thay thế pinyin. Số trong ngoặc là thanh: 1 cao đều, 2 đi lên, 3 thấp rồi lên khi đọc riêng, 4 hạ nhanh, 0 nhẹ.\n\n5 từ mới\n• 时间 shíjiān: thời gian\nGần đúng: sư(2)-chien(1)\n• 现在 xiànzài: bây giờ\nGần đúng: xien(4)-chai(4)\n• 今天 jīntiān: hôm nay\nGần đúng: chin(1)-thien(1)\n• 点 diǎn: giờ, dùng khi nói giờ\nGần đúng: điển(3)\n• 分 fēn: phút\nGần đúng: phân(1)\n\n5 câu luyện\n1. 现在几点？\nXiànzài jǐ diǎn?\nGần đúng khi nói liền: xien(4)-chai(4) chi(2) điển(3)\n→ Mấy giờ rồi?\n\n2. 现在八点。\nXiànzài bā diǎn.\nGần đúng: xien(4)-chai(4) ba(1) điển(3)\n→ Bây giờ là 8 giờ.\n\n3. 今天很忙。\nJīntiān hěn máng.\nGần đúng: chin(1)-thien(1) hẩn(3, thấp) máng(2)\n→ Hôm nay rất bận.\n\n4. 休息十分钟。\nXiūxi shí fēnzhōng.\nGần đúng: xiu(1)-xi(0) sư(2) phân(1)-chung(1)\n→ Nghỉ 10 phút.\n\n5. 什么时候上班？\nShénme shíhou shàngbān?\nGần đúng: sân(2)-mơ(0) sư(2)-hâu(0) shang(4)-ban(1)\n→ Khi nào đi làm?\n\nLưu ý\n• 几点 có hai thanh 3 liền nhau: khi nói, jǐ đổi thành thanh 2, đọc jí diǎn; pinyin vẫn giữ thanh gốc.\n• hěn trước máng thường chỉ đọc phần thấp của thanh 3.\n• sh: đầu lưỡi hơi cong lên phía sau nhưng không chạm vòm, để hơi xát qua khe hẹp. j không bật hơi, tiān có t bật hơi.\n• Không lấy dấu sắc/nặng tiếng Việt thay cho thanh tiếng Trung; nghe mẫu để sửa âm.\n\nNguồn hướng dẫn phát âm: Đại học Hawaiʻi; từ vựng và pinyin đối chiếu Wiktionary. Câu luyện và cách đọc gần đúng do bạn biên soạn.\nhttps://laulima.hawaii.edu/access/content/group/613e6b40-7843-4d5c-94ca-41a9e0831b95/CBasic1/u1/u1_p1.html\nhttps://en.wiktionary.org/wiki/%E6%99%82%E9%96%93\nhttps://en.wiktionary.org/wiki/%E4%BC%91%E6%81%AF\nhttps://en.wiktionary.org/wiki/%E4%B8%8A%E7%8F%AD", "TIẾNG ANH: Thời gian và giờ làm việc\n\nHôm nay dùng phiên âm giọng Anh-Anh. Cách đọc chữ Việt chỉ gợi âm; phần viết hoa gợi trọng âm, không phải dấu thanh chuẩn.\n\n5 từ mới\n• time /taɪm/: thời gian, giờ\nGần đúng: THAIM, khép môi ở m cuối.\n• now /naʊ/: bây giờ\nGần đúng: NAO, một âm gọn, không thêm “nh”.\n• today /təˈdeɪ/: hôm nay\nGần đúng: tờ-ĐÂY, nhấn âm sau.\n• o'clock /əˈklɒk/: …giờ đúng\nGần đúng: ờ-KLOC, giữ k cuối.\n• minute /ˈmɪnɪt/: phút\nGần đúng: MI-nịt, hai âm i ngắn, nhấn âm đầu.\n\n5 câu luyện\n1. What time is it?\n/wɒt taɪm ɪz ɪt/\nGần đúng: quót THAIM iz it\n→ Mấy giờ rồi?\n\n2. I start work at nine o'clock.\n/aɪ stɑːt wɜːk ət naɪn əˈklɒk/\nGần đúng: ai s-TAAT uơơk ợt NAIN ờ-KLOC\n→ Mình bắt đầu làm lúc 9 giờ.\n\n3. Today I clean the living room.\n/təˈdeɪ aɪ kliːn ðə ˈlɪvɪŋ ruːm/\nGần đúng: tờ-ĐÂY ai KLIIN đờ LI-ving RUUM\n→ Hôm nay mình dọn phòng khách.\n\n4. Please wait five minutes.\n/pliːz weɪt faɪv ˈmɪnɪts/\nGần đúng: PLIIZ uâyt FAIV MI-nịts\n→ Làm ơn đợi 5 phút.\n\n5. I'm free this afternoon.\n/aɪm friː ðɪs ˌɑːftəˈnuːn/\nGần đúng: aim FRII đis aaf-tờ-NUUN\n→ Chiều nay mình rảnh.\n\nLưu ý\n• /ð/ trong the, this: đặt nhẹ đầu lưỡi giữa hai hàm răng và rung cổ họng; không đọc hệt đ hoặc th tiếng Việt.\n• Giữ m, t, k, z, v ở cuối từ nhưng không thêm “ờ”.\n• /ɜː/ trong work và /æ/, /ɑː/ không có âm Việt khớp hoàn toàn. Ưu tiên nghe mẫu hơn cách ghi gần đúng.\n\nMình thử nói giờ bắt đầu làm việc bằng câu số 2 nhé.\n\nNguồn từ và phát âm: Cambridge. Câu luyện và cách đọc gần đúng do bạn biên soạn.\nhttps://dictionary.cambridge.org/pronunciation/english/time\nhttps://dictionary.cambridge.org/pronunciation/english/now\nhttps://dictionary.cambridge.org/pronunciation/english/today\nhttps://dictionary.cambridge.org/pronunciation/english/o-clock\nhttps://dictionary.cambridge.org/pronunciation/english/minute\nhttps://dictionary.cambridge.org/pronunciation/english/work"]}, {"date": "2026-10-22", "label": "22/10/2026", "title": "Động tác dọn dẹp", "parts": ["Bài sáng 22/10 cho Chu: Động tác dọn dẹp\n\nTIẾNG TRUNG\nSố trong ngoặc chỉ thanh: 1 cao đều, 2 đi lên, 3 thấp rồi lên khi đọc riêng, 4 hạ nhanh, 0 nhẹ. Cách ghi tiếng Việt chỉ gần đúng; ưu tiên pinyin và nghe mẫu.\n\n5 từ mới\n1. 扫 sǎo: quét\nGần đúng: sảo(3).\n2. 擦 cā: lau, chà\nGần đúng: cha(1), bật hơi ở đầu.\n3. 洗 xǐ: rửa, giặt\nGần đúng: xi(3).\n4. 整理 zhěnglǐ: dọn gọn, sắp xếp\nGần đúng khi nói liền: châng(2)-li(3). Hai thanh 3 liền nhau nên âm đầu đọc thành thanh 2: zhénglǐ; pinyin vẫn giữ thanh gốc.\n5. 扔 rēng: vứt, ném\nGần đúng: râng(1). Âm r cong lưỡi, không rung đầu lưỡi như cách đọc r ở một số giọng tiếng Việt.\n\n5 câu luyện\n1. 我去扫地。\nWǒ qù sǎodì.\nGần đúng: uô(3, thấp) chuy(4) sảo(3, thấp)-đi(4).\n→ Tớ đi quét nhà.\n\n2. 请擦桌子。\nQǐng cā zhuōzi.\nGần đúng: chỉnh(3, thấp) cha(1) chuô(1)-dơ(0).\n→ Làm ơn lau bàn.\n\n3. 她在洗衣服。\nTā zài xǐ yīfu.\nGần đúng: tha(1) chai(4) xi(3, thấp) i(1)-phu(0).\n→ Chị ấy đang giặt quần áo.\n\n4. 房间很干净。\nFángjiān hěn gānjìng.\nGần đúng: pháng(2)-chien(1) hẩn(3, thấp) can(1)-ching(4).\n→ Phòng rất sạch.\n\n5. 别扔这个。\nBié rēng zhège.\nGần đúng: biê(2) râng(1) chơ(4)-gơ(0).\n→ Đừng vứt cái này.\n\nChỗ dễ nhầm\n• Thanh 3 trước thanh 1, 2 hoặc 4 thường chỉ đọc phần thấp, không cố uốn lên ở mỗi từ.\n• qù: phần nguyên âm là ü, đặt lưỡi như đọc i nhưng tròn môi như u; “chuy” chỉ là gợi âm, không đọc thành hai tiếng.\n• c trong cā có bật hơi; zh trong zhěnglǐ không bật hơi. r có rung dây thanh nhưng không rung đầu lưỡi.\n\nCâu luyện và cách ghi gần đúng do tớ biên soạn. Nguồn phát âm: Đại học Hawaiʻi; pinyin đối chiếu Wiktionary.\nhttps://laulima.hawaii.edu/access/content/group/613e6b40-7843-4d5c-94ca-41a9e0831b95/CBasic1/u1/u1_p1.html\nhttps://en.wiktionary.org/wiki/%E6%95%B4%E7%90%86\nhttps://en.wiktionary.org/wiki/%E6%89%94", "TIẾNG ANH: Động tác dọn dẹp\nDùng phiên âm Anh-Anh. Chữ Việt chỉ gợi âm, chữ hoa gợi trọng âm; không phải cách phát âm chuẩn thay thế bản nghe.\n\n5 từ mới\n1. sweep /swiːp/: quét\nGần đúng: suíp, kéo dài i, khép môi ở p cuối.\n2. scrub /skrʌb/: cọ, chà mạnh\nGần đúng: skrâb, nối s-k-r liền nhau, không thêm “ờ”; cuối từ là b, không thêm nguyên âm sau b.\n3. wash /wɒʃ/: rửa, giặt\nGợi âm: uo-sh, một âm tiết. Cuối là /ʃ/, hơi xát không rung; không có âm t.\n4. organise /ˈɔːɡənaɪz/: sắp xếp\nGần đúng: O-gờ-naiz, nhấn âm đầu, giữ z cuối.\n5. throw /θrəʊ/: ném, vứt\nGần đúng: thrâu. /θ/: đầu lưỡi giữa hai hàm răng, thổi hơi không rung rồi nối sang r.\n\n5 câu luyện\n1. I will sweep the floor.\n/aɪ wɪl swiːp ðə flɔː/\nGần đúng: ai uil SUÍP đờ FLOO.\n→ Tớ sẽ quét sàn.\n\n2. Please scrub the sink.\n/pliːz skrʌb ðə sɪŋk/\nGần đúng: PLIIZ SKRÂB đờ SINGK.\n→ Làm ơn cọ bồn rửa.\n\n3. She is washing clothes.\n/ʃiː ɪz ˈwɒʃɪŋ kləʊðz/\nGợi âm: shii iz UO-shing KLÂU-thz.\n→ Chị ấy đang giặt đồ.\n\n4. The room is very clean.\n/ðə ruːm ɪz ˈveri kliːn/\nGần đúng: đờ RUUM iz VE-ri KLIIN.\n→ Phòng rất sạch.\n\n5. Don't throw this away.\n/dəʊnt θrəʊ ðɪs əˈweɪ/\nGần đúng: ĐÂUNT THRÂU đis ờ-UÂY.\n→ Đừng vứt cái này đi.\n\nChỗ dễ nhầm\n• /ð/ trong the, this và cuối clothes: đầu lưỡi giữa hai hàm răng, có rung dây thanh; khác /θ/ không rung trong throw.\n• washing có /ʃ/ giữa từ, không chèn t hay thêm s sau /ʃ/.\n• sink kết thúc /ŋk/: âm mũi ng rồi k. will giữ l cuối; clothes giữ cụm /ðz/. Luyện chậm từng âm rồi nối, không thêm “ờ”.\n\nChu thử dùng câu 1 để nói việc sắp làm nhé.\n\nTừ và phát âm theo Cambridge; câu luyện và gợi âm do tớ biên soạn. Có thể bấm loa ở các trang này để nghe chuẩn:\nhttps://dictionary.cambridge.org/pronunciation/english/sweep\nhttps://dictionary.cambridge.org/pronunciation/english/scrub\nhttps://dictionary.cambridge.org/pronunciation/english/wash\nhttps://dictionary.cambridge.org/pronunciation/english/organize\nhttps://dictionary.cambridge.org/pronunciation/english/throw\nhttps://dictionary.cambridge.org/pronunciation/english/clothes"]}, {"date": "2026-10-30", "label": "30/10/2026", "title": "Thời tiết", "parts": ["Bài học sáng 30/10 cho Chu: Thời tiết\n\nTIẾNG TRUNG\nSố trong ngoặc chỉ thanh: 1 cao đều, 2 đi lên, 3 thấp rồi lên khi đọc riêng, 4 hạ nhanh, 0 nhẹ. Cách đọc tiếng Việt chỉ gợi âm, không thay thế pinyin và bản nghe.\n\n5 từ mới\n1. 天气 tiānqì: thời tiết.\nGần đúng: thien(1)-chi(4). q có bật hơi.\n2. 热 rè: nóng.\nGần đúng: rơ(4). Cong lưỡi, không rung đầu lưỡi.\n3. 冷 lěng: lạnh.\nGần đúng: lẩng(3).\n4. 下雨 xiàyǔ: mưa.\nGợi âm: xia(4)-ü(3). Với ü, đặt lưỡi như đọc i rồi tròn môi như u; giữ một nguyên âm, không đọc thành hai tiếng i-u hay thành u tiếng Việt.\n5. 风 fēng: gió.\nGần đúng: phâng(1).\n\n5 câu luyện\n1. 今天天气很好。\nJīntiān tiānqì hěn hǎo.\nGần đúng khi nói liền: chin(1)-thien(1) thien(1)-chi(4) hấn(2) hảo(3).\n→ Hôm nay thời tiết đẹp.\nhěn hǎo là hai thanh 3 liên tiếp, nên âm đầu đọc thành thanh 2.\n\n2. 这里不热。\nZhèlǐ bú rè.\nGần đúng: chơ(4)-li(3, thấp) bú(2) rơ(4).\n→ Ở đây không nóng.\n不 vốn đọc bù, nhưng trước rè thanh 4 thì đổi thành bú. lǐ đứng trước bú thanh 2 nên đọc phần thấp.\n\n3. 你冷吗？\nNǐ lěng ma?\nGần đúng khi nói liền: ní(2) lẩng(3) ma(0).\n→ Cậu có lạnh không?\nnǐ đứng trước lěng nên đọc thành ní; ma đọc nhẹ.\n\n4. 外面下雨了。\nWàimiàn xiàyǔ le.\nGần đúng: oai(4)-mien(4) xia(4)-ü(3) lơ(0).\n→ Ngoài trời mưa rồi.\nGiữ âm ü như hướng dẫn ở từ mới. Trong câu này yǔ thường đọc phần thấp, le đọc nhẹ.\n\n5. 风很大。\nFēng hěn dà.\nGần đúng: phâng(1) hẩn(3, thấp) đa(4).\n→ Gió to.\nhěn trước dà thanh 4 thường chỉ đọc phần thấp.\n\nNguồn quy tắc phát âm: Đại học Hawaiʻi. Câu luyện và gợi âm do tớ biên soạn.\nhttps://laulima.hawaii.edu/access/content/group/613e6b40-7843-4d5c-94ca-41a9e0831b95/CBasic1/u1/u1_p1.html\nPinyin đối chiếu:\nhttps://en.wiktionary.org/wiki/%E4%B8%8B%E9%9B%A8\nhttps://en.wiktionary.org/wiki/%E5%A4%A9%E6%B0%A3", "TIẾNG ANH: Thời tiết\nPhiên âm Anh-Anh. Chữ hoa gợi trọng âm; chữ Việt chỉ hỗ trợ cách đọc.\n\n5 từ mới\n1. weather /ˈweðə/: thời tiết.\nGần đúng: UÊ-đơ.\n2. hot /hɒt/: nóng.\nGần đúng: hot, nguyên âm ngắn, giữ t cuối, không thêm “tờ”.\n3. cold /kəʊld/: lạnh.\nGần đúng: khâuld, giữ cả l và d cuối, không chèn “ờ”.\n4. rain /reɪn/: mưa.\nGần đúng: rêin, giữ n cuối.\n5. windy /ˈwɪndi/: có gió.\nGần đúng: UIN-đi, nhấn âm đầu.\n\n5 câu luyện\n1. The weather is nice today.\n/ðə ˈweðə ɪz naɪs təˈdeɪ/\nGần đúng: đờ UÊ-đơ iz NAIS tờ-ĐÂY.\n→ Hôm nay thời tiết đẹp.\n\n2. It isn't hot in here.\n/ɪt ˈɪzənt hɒt ɪn hɪə/\nGần đúng: it Í-zờnt HOT in hi-ờ.\n→ Trong này không nóng.\n\n3. Are you cold?\n/ɑː juː kəʊld/\nGần đúng: aa yuu KHÂULD?\n→ Cậu có lạnh không?\n\n4. It's raining outside.\n/ɪts ˈreɪnɪŋ ˌaʊtˈsaɪd/\nGần đúng: its RÊI-ning aut-SAID.\n→ Ngoài trời đang mưa.\n\n5. It's windy today.\n/ɪts ˈwɪndi təˈdeɪ/\nGần đúng: its UIN-đi tờ-ĐÂY.\n→ Hôm nay có gió.\n\nChỗ dễ nhầm\n• /ð/ trong the và weather: đặt đầu lưỡi nhẹ giữa hai hàm răng, thổi hơi có rung dây thanh. “đ” chỉ là gợi âm, không phải âm đ tiếng Việt.\n• cold giữ cụm /ld/; isn't giữ /nt/; it's giữ /ts/. Nối âm, không thêm nguyên âm vào giữa.\n• rain có /eɪ/, không đọc thành một âm e ngắn. raining kết thúc /ŋ/, không thêm g bật ra.\n\nNguồn phát âm Cambridge; câu luyện và gợi âm do tớ biên soạn. Chu có thể bấm loa ở từng trang để nghe:\nhttps://dictionary.cambridge.org/pronunciation/english/weather\nhttps://dictionary.cambridge.org/pronunciation/english/hot\nhttps://dictionary.cambridge.org/pronunciation/english/cold\nhttps://dictionary.cambridge.org/pronunciation/english/rain\nhttps://dictionary.cambridge.org/pronunciation/english/windy"]}, {"date": "2026-10-31", "label": "31/10/2026", "title": "Đồ vật trong phòng", "parts": ["Bài sáng 31/10 cho Chu: Đồ vật trong phòng\n\nTIẾNG TRUNG\nSố trong ngoặc là thanh: 1 cao đều, 2 đi lên, 3 thấp rồi lên khi đọc riêng, 4 hạ nhanh, 0 nhẹ. Chữ Việt chỉ gợi âm, không thay thế pinyin.\n\n5 từ mới\n1. 床 chuáng: giường.\nGần đúng: chuang(2); ch cong lưỡi, bật hơi.\n2. 椅子 yǐzi: ghế.\nGần đúng: i(3)-dơ(0).\n3. 灯 dēng: đèn.\nGần đúng: tâng(1); d không bật hơi, không hoàn toàn giống đ tiếng Việt.\n4. 门 mén: cửa.\nGần đúng: mân(2).\n5. 窗户 chuānghu: cửa sổ.\nGần đúng: chuang(1)-hu(0); ch cong lưỡi, bật hơi.\n\n5 câu luyện\n1. 请开窗户。\nQǐng kāi chuānghu.\nGần đúng: chỉnh(3, thấp) khai(1) chuang(1)-hu(0).\n→ Làm ơn mở cửa sổ.\n\n2. 我铺床。\nWǒ pū chuáng.\nGần đúng: uô(3, thấp) phu(1) chuang(2).\n→ Tớ trải giường.\n\n3. 请关门。\nQǐng guān mén.\nGần đúng: chỉnh(3, thấp) quan(1) mân(2).\n→ Làm ơn đóng cửa.\n\n4. 灯不亮。\nDēng bú liàng.\nGần đúng: tâng(1) bú(2) liang(4).\n→ Đèn không sáng.\n不 vốn đọc bù, trước liàng thanh 4 đổi thành bú.\n\n5. 这个窗户打不开。\nZhège chuānghu dǎ bu kāi.\nGần đúng: chơ(4)-gơ(0) chuang(1)-hu(0) tả(3)-bu(0) khai(1).\n→ Cửa sổ này không mở được.\nTrong 打不开, bu đọc nhẹ: cấu trúc này diễn đạt “không mở được”, khác với chỉ nói “không mở”.\n\nChỗ dễ nhầm: qǐng và wǒ trước thanh 1 thường chỉ đọc phần thấp của thanh 3, không cố uốn lên ở mỗi từ. Gợi âm chỉ là điểm bắt đầu, cần đối chiếu bản nghe.\n\nNguồn pinyin và ngữ pháp:\nhttps://en.wiktionary.org/wiki/%E5%BA%8A\nhttps://en.wiktionary.org/wiki/%E6%A4%85%E5%AD%90\nhttps://en.wiktionary.org/wiki/%E7%87%88\nhttps://en.wiktionary.org/wiki/%E9%96%80\nhttps://en.wiktionary.org/wiki/%E7%AA%97%E6%88%B6\nhttps://resources.allsetlearning.com/chinese/grammar/Potential_complement", "TIẾNG ANH: Đồ vật trong phòng\nPhiên âm Anh-Anh. Chữ Việt chỉ gợi âm; ưu tiên nghe mẫu ở các nguồn bên dưới.\n\n5 từ mới\n1. bed /bed/: giường.\nGợi âm: bed, nguyên âm e ngắn; giữ d cuối, không thêm “đờ”.\n2. chair /tʃeə/: ghế.\nGần đúng: che-ờ, một âm tiết; không đọc r cuối trong giọng mẫu này.\n3. lamp /læmp/: đèn, thường là đèn bàn hoặc đèn đứng.\nGần đúng: lemp; /æ/ mở miệng rộng hơn e, giữ cụm mp cuối.\n4. door /dɔː/: cửa.\nGần đúng: đoo, kéo dài nguyên âm, không đọc r cuối trong giọng mẫu này.\n5. window /ˈwɪndəʊ/: cửa sổ.\nGần đúng: UIN-đâu, nhấn âm đầu.\n\n5 câu luyện\n1. Please open the window.\n/pliːz ˈəʊpən ðə ˈwɪndəʊ/\nGần đúng: PLIIZ ÂU-pờn đờ UIN-đâu.\n→ Làm ơn mở cửa sổ.\n\n2. I will make the bed.\n/aɪ wɪl meɪk ðə bed/\nGần đúng: ai uil MÂYK đờ BED.\n→ Tớ sẽ dọn, trải giường.\nmake the bed là cụm chỉ việc sắp xếp chăn, ga, gối cho giường gọn gàng.\n\n3. Please close the door.\n/pliːz kləʊz ðə dɔː/\nGần đúng: PLIIZ KLÂUZ đờ ĐOO.\n→ Làm ơn đóng cửa.\nclose là động từ “đóng” nên kết thúc bằng /z/, có rung dây thanh.\n\n4. The lamp doesn't work.\n/ðə læmp ˈdʌzənt wɜːk/\nGần đúng: đờ LEMP ĐÂ-zờnt UƠƠK.\n→ Đèn không hoạt động.\n\n5. This window won't open.\n/ðɪs ˈwɪndəʊ wəʊnt ˈəʊpən/\nGần đúng: đis UIN-đâu UÂUNT ÂU-pờn.\n→ Cửa sổ này không mở được.\n\nChỗ dễ nhầm\n• please giữ /z/ cuối; will giữ /l/ cuối; lamp giữ /mp/. Không chèn “ờ” sau phụ âm cuối.\n• /ð/ trong the và this: đầu lưỡi nhẹ giữa hai hàm răng, thổi hơi có rung dây thanh; không phải âm đ tiếng Việt.\n• won't /wəʊnt/ khác want /wɒnt/: chú ý nguyên âm, không bỏ n trong cụm nt.\n\nCâu luyện và gợi âm do tớ biên soạn. Nguồn phát âm Cambridge, bấm loa để nghe:\nhttps://dictionary.cambridge.org/pronunciation/english/bed\nhttps://dictionary.cambridge.org/pronunciation/english/chair\nhttps://dictionary.cambridge.org/pronunciation/english/lamp\nhttps://dictionary.cambridge.org/pronunciation/english/door\nhttps://dictionary.cambridge.org/pronunciation/english/window\nhttps://dictionary.cambridge.org/pronunciation/english/close\nhttps://dictionary.cambridge.org/pronunciation/english/won-t"]}, {"date": "2026-11-03", "label": "3/11/2026", "title": "Bữa ăn", "parts": ["Bài học cho Chu: Bữa ăn\n\nTIẾNG TRUNG\nSố trong ngoặc là thanh: 1 cao đều, 2 đi lên, 3 thấp rồi lên khi đọc riêng, 4 hạ nhanh, 0 nhẹ. Chữ Việt chỉ gợi âm, không thay thế pinyin.\n\n5 từ mới\n1. 吃 chī: ăn.\nGần đúng: chi(1); ch cong lưỡi, bật hơi.\n2. 米饭 mǐfàn: cơm.\nGần đúng: mỉ(3)-phan(4).\n3. 面条 miàntiáo: mì sợi.\nGần đúng: mien(4)-thiao(2).\n4. 饿 è: đói.\nGần đúng: ơ(4), hạ nhanh.\n5. 饱 bǎo: no.\nGần đúng: bảo(3); b không bật hơi.\n\n5 câu luyện\n1. 你吃饭了吗？\nNǐ chīfàn le ma?\nGần đúng: nỉ(3, thấp) chi(1)-phan(4) lơ(0) ma(0).\n→ Cậu ăn cơm chưa?\nĐây là câu hỏi thăm quen thuộc trong giao tiếp Trung Quốc hằng ngày.\n\n2. 中午吃米饭。\nZhōngwǔ chī mǐfàn.\nGần đúng: chung(1)-ủ(3, thấp) chi(1) mỉ(3)-phan(4).\n→ Trưa ăn cơm.\n\n3. 我饿了。\nWǒ è le.\nGần đúng: uô(3, thấp) ơ(4) lơ(0).\n→ Tớ đói rồi.\n\n4. 我吃饱了。\nWǒ chī bǎo le.\nGần đúng: uô(3, thấp) chi(1) bảo(3, thấp) lơ(0).\n→ Tớ no rồi.\n\n5. 我不吃辣。\nWǒ bù chī là.\nGần đúng: uô(3, thấp) bu(4) chi(1) la(4).\n→ Tớ không ăn cay.\n不 chỉ đổi thành bú trước thanh 4; ở đây đứng trước chī thanh 1 nên giữ nguyên bù.\n\nChỗ dễ nhầm: nǐ, wǔ, wǒ, mǐ đứng trước thanh khác thanh 3 thường chỉ đọc phần thấp của thanh 3, không cố uốn lên. Gợi âm chỉ là điểm bắt đầu, cần đối chiếu bản nghe.\n\nNguồn pinyin và quy tắc thanh:\nhttps://en.wiktionary.org/wiki/%E5%90%83\nhttps://en.wiktionary.org/wiki/%E7%B1%B3%E9%A3%AF\nhttps://en.wiktionary.org/wiki/%E9%BA%B5%E6%A2%9D\nhttps://en.wiktionary.org/wiki/%E9%A4%93\nhttps://en.wiktionary.org/wiki/%E9%A3%BD\nhttps://laulima.hawaii.edu/access/content/group/613e6b40-7843-4d5c-94ca-41a9e0831b95/CBasic1/u1/u1_p1.html\nNguồn câu hỏi thăm 你吃饭了吗:\nhttps://goeastmandarin.com/chinese-phrase-have-you-eaten/", "TIẾNG ANH: Bữa ăn\nPhiên âm Anh-Anh. Chữ Việt chỉ gợi âm; ưu tiên nghe mẫu ở các nguồn bên dưới.\n\n5 từ mới\n1. eat /iːt/: ăn.\nGần đúng: i:t, kéo dài i, giữ t cuối.\n2. rice /raɪs/: cơm, gạo.\nGần đúng: rais, kết thúc s không rung.\n3. noodles /ˈnuːdəlz/: mì sợi.\nGần đúng: NU:-dôlz, nhấn âm đầu, kết thúc z rung.\n4. hungry /ˈhʌŋɡri/: đói.\nGần đúng: HĂNG-gri. Giữ cả âm mũi ng lẫn âm g sau nó, chỉ tránh thêm nguyên âm (\"hun-gơ-ri\" là sai).\n5. full /fʊl/: no.\nGần đúng: phul, u ngắn, giữ l cuối.\n\n5 câu luyện\n1. Have you eaten yet?\n/həv juː ˈiːtən jet/\nGần đúng: hơv iu: I:tơn IET?\n→ Cậu ăn chưa?\n\n2. I eat rice for lunch.\n/aɪ iːt raɪs fə lʌntʃ/\nGần đúng: ai i:t RAIS phơ LĂNCH.\n→ Tớ ăn cơm trưa.\n\n3. I'm hungry.\n/aɪm ˈhʌŋɡri/\nGần đúng: aim HĂNG-gri.\n→ Tớ đói.\n\n4. I'm full.\n/aɪm fʊl/\nGần đúng: aim PHUL.\n→ Tớ no.\n\n5. I don't eat spicy food.\n/aɪ dəʊnt iːt ˈspaɪsi fuːd/\nGần đúng: ai ĐÂUNT i:t SPAI-si PHU:D.\n→ Tớ không ăn đồ cay.\n\nChỗ dễ nhầm\n• don't giữ cụm nt cuối; spicy đọc liền cụm sp, không thêm nguyên âm giữa.\n• lunch kết thúc cụm n+ch khô; eaten nhấn âm đầu.\n• hungry giữ đủ ng + g, không đọc \"hun-gơ-ri\".\n\nCâu luyện và gợi âm do tớ biên soạn. Nguồn phát âm Cambridge, bấm loa để nghe:\nhttps://dictionary.cambridge.org/pronunciation/english/eat\nhttps://dictionary.cambridge.org/pronunciation/english/rice\nhttps://dictionary.cambridge.org/pronunciation/english/noodle\nhttps://dictionary.cambridge.org/pronunciation/english/hungry\nhttps://dictionary.cambridge.org/pronunciation/english/full"]}, {"date": "2026-11-04", "label": "4/11/2026", "title": "Xin phép và nhờ giúp", "parts": ["Bài học 4/11: Xin phép và nhờ giúp\n\nTIẾNG TRUNG\nCách đọc gần đúng chỉ để hỗ trợ; Chu ưu tiên pinyin và nghe mẫu nhé.\n\n5 từ mới\n1. 可以 kěyǐ: được phép, có thể.\nGần đúng: \"khé-ỉ\". Hai thanh 3 liền nhau: âm đầu chuyển thành thanh đi lên, đọc ké yǐ; không đọc yǐ thành thanh rơi.\n2. 需要 xūyào: cần.\nGần đúng: \"xü-yao\". xū giữ giọng cao ngang; đặt lưỡi như đọc i nhưng tròn môi như u. yào hạ giọng mạnh.\n3. 帮忙 bāngmáng: giúp đỡ.\nGần đúng: \"bang-máng\". bāng cao ngang, máng đi lên.\n4. 麻烦 máfan: phiền, làm phiền.\nGần đúng: \"má-phan\". má đi lên, fan nhẹ.\n5. 对不起 duìbùqǐ: xin lỗi.\nGần đúng: \"đuây-bu-chỉ\". duì hạ giọng; bu thường nhẹ trong lời nói tự nhiên. qǐ đọc gần \"chỉ\" nhưng đầu lưỡi không cong ngược, có bật hơi.\n\n5 câu mẫu\n1. 可以进来吗？Kěyǐ jìnlái ma?\nTớ vào được không?\nGần đúng: \"khé-ỉ chin-lái ma?\" jìn hạ giọng, lái đi lên, ma nhẹ.\n2. 需要帮忙吗？Xūyào bāngmáng ma?\nCó cần giúp không?\nGần đúng: \"xü-yao bang-máng ma?\"\n3. 麻烦你开门。Máfan nǐ kāi mén.\nPhiền anh/chị mở cửa giúp.\nGần đúng: \"má-phan nỉ khai-mấn\". nǐ đọc trầm, kāi cao ngang, mén đi lên.\n4. 对不起，我迟到了。Duìbuqǐ, wǒ chídào le.\nXin lỗi, tớ đến muộn.\nGần đúng: \"đuây-bu-chỉ, uổ chứ-đao lơ\". chí đi lên, dào hạ mạnh, le nhẹ. Âm đầu chí cần cong nhẹ đầu lưỡi, khác qǐ ở trên.\n5. 还需要什么？Hái xūyào shénme?\nCòn cần gì nữa?\nGần đúng: \"hái xü-yao sấn-mơ\". hái và shén đi lên, me nhẹ.\n\nNguồn tra từ và phát âm: Wiktionary, mục 可以 và 需要; hướng dẫn ngữ âm Đại học Hawaii:\nhttps://en.wiktionary.org/wiki/%E5%8F%AF%E4%BB%A5\nhttps://en.wiktionary.org/wiki/%E9%9C%80%E8%A6%81\nhttps://laulima.hawaii.edu/access/content/group/613e6b40-7843-4d5c-94ca-41a9e0831b95/CBasic1/u1/u1_p1.html", "TIẾNG ANH: Xin phép và nhờ giúp\n\n5 từ mới\n1. may /meɪ/: được phép, có thể.\nGần đúng: \"mây\".\n2. need /niːd/: cần.\nGần đúng: \"niid\". Kéo dài i, kết thúc bằng /d/, không thêm một tiếng \"đờ\".\n3. help /help/: giúp đỡ.\nGần đúng: \"help\". Giữ cả /l/ và /p/ cuối, không chỉ đọc \"hép\".\n4. excuse /ɪkˈskjuːz/: thứ lỗi, bỏ qua lỗi (động từ).\nGần đúng: \"ik-SKIU:z\". Nhấn âm hai, âm cuối /z/ có rung; không đọc thành /d/.\n5. could /kʊd/: có thể, dùng khi nhờ vả lịch sự.\nGần đúng: \"khud\". u ngắn, âm cuối /d/, không phải /t/.\n\n5 câu mẫu\n1. May I come in?\nTớ vào được không?\nGần đúng: \"mây ai căm in?\"\n2. Do you need any help?\nAnh/chị có cần giúp gì không?\nGần đúng: \"đơ yu niid é-ni help?\"\n3. Could you open the door, please?\nAnh/chị mở cửa giúp được không?\nGần đúng: \"khud yu âu-pần đờ đo: pliiz?\" Giữ /z/ cuối please. Trong giọng Anh-Anh đang học, door đứng trước please không đọc r.\n4. Sorry, I'm late.\nXin lỗi, tớ đến muộn.\nGần đúng: \"so-ri aim lâyt\". Giữ /t/ cuối late.\n5. Do you need anything else?\nAnh/chị có cần gì nữa không?\nGần đúng: \"đơ yu niid é-ni-thing els?\" Với th trong anything, đặt đầu lưỡi nhẹ giữa răng rồi thổi hơi, không rung; else giữ cả /l/ và /s/ cuối.\n\nCâu mẫu do tớ soạn. Nguồn phát âm Anh-Anh: Cambridge Dictionary, các mục need, help, excuse, could:\nhttps://dictionary.cambridge.org/pronunciation/english/need\nhttps://dictionary.cambridge.org/pronunciation/english/help\nhttps://dictionary.cambridge.org/pronunciation/english/excuse\nhttps://dictionary.cambridge.org/pronunciation/english/could"]}, {"date": "2026-11-05", "label": "5/11/2026", "title": "Vị trí và hướng", "parts": ["Bài sáng 5/11 của Chu: Vị trí và hướng.\n\nTIẾNG TRUNG\nCách đọc tiếng Việt dưới đây chỉ gần đúng; dấu thanh trong phiên âm là mốc chính nhé.\n\n5 từ mới:\n1. 这里 · zhèlǐ · ở đây\nĐọc gần: chờ-lỉ. Âm zhè xuống giọng.\n2. 那里 · nàlǐ · ở đó\nĐọc gần: na-lỉ. Âm nà xuống giọng.\n3. 哪里 · nǎlǐ · ở đâu\nĐọc gần: ná-lỉ. Hai thanh 3 đứng cạnh nhau nên âm đầu đọc thành thanh đi lên.\n4. 上 · shàng · trên\nĐọc gần: sang, xuống giọng; sh có đầu lưỡi cong hơn âm s tiếng Việt.\n5. 下 · xià · dưới\nĐọc gần: sia, xuống giọng; đừng đọc giống shàng.\n\n5 câu thường dùng:\n1. 拖把在哪里？\nTuōbǎ zài nǎlǐ?\nCây lau nhà ở đâu?\nGần đúng: tuo-bả chai ná-lỉ?\n\n2. 杯子在桌子上。\nBēizi zài zhuōzi shang.\nCái cốc ở trên bàn.\nGần đúng: bây-dzự chai chuô-dzự sang.\nHai âm zi và âm shang ở đây đọc nhẹ.\n\n3. 垃圾在下面。\nLājī zài xiàmian.\nRác ở bên dưới.\nGần đúng: la-chi chai sia-miên; âm mian đọc nhẹ.\n\n4. 请坐这里。\nQǐng zuò zhèlǐ.\nMời ngồi đây.\nGần đúng: chỉng chuô chờ-lỉ.\nÂm q bật hơi; qǐng trước âm thanh 4 đọc trầm, không cần uốn giọng lên rõ.\n\n5. 洗手间在那里。\nXǐshǒujiān zài nàlǐ.\nNhà vệ sinh ở đằng kia.\nGần đúng: sí-sổu-chiên chai na-lỉ.\nHai thanh 3 trong xǐshǒu khiến âm đầu đọc thành xí.\n\nNhớ nhanh: 这里 / 那里 / 哪里 = đây / đó / đâu.\n\nNguồn từ và phát âm:\nhttps://en.wiktionary.org/wiki/這裡\nhttps://en.wiktionary.org/wiki/哪裡\nhttps://en.wiktionary.org/wiki/洗手間\nQuy tắc đổi thanh:\nhttps://chinesefor.us/lessons/mandarin-three-third-tones-change-sandhi/", "TIẾNG ANH\nPhiên âm theo giọng Anh-Anh. Cách đọc tiếng Việt chỉ giúp nhớ bước đầu, không thay được âm mẫu.\n\n5 từ mới:\n1. here /hɪə/ · ở đây\nGần đúng: hi-a.\n2. there /ðeə/ · ở đó\nGần đúng: đe-a. Âm đầu đặt đầu lưỡi nhẹ giữa hai hàm răng, có rung giọng; không phải đ tiếng Việt.\n3. on /ɒn/ · trên\nGần đúng: on, nguyên âm ngắn.\n4. under /ˈʌndə/ · dưới\nGần đúng: ấn-đơ, nhấn âm đầu.\n5. where /weə/ · ở đâu\nGần đúng: ue-a, bắt đầu bằng môi tròn rồi mở ra, không thêm âm cứng ở đầu.\n\n5 câu thường dùng:\n1. Where is the mop?\nCây lau nhà ở đâu?\nGần đúng: ue-a iz đơ móp?\nIs kết bằng /z/, không đọc thành “ít”.\n\n2. Put it on the chair, please.\nĐặt nó lên ghế giúp nhé.\nGần đúng: put it on đơ che-a pliiz.\nPlease kéo dài âm i và giữ /z/ cuối, không đọc cụt “pli”.\n\n3. The gloves are under the chair.\nGăng tay ở dưới ghế.\nGần đúng: đơ glâvz ơ ấn-đơ đơ che-a.\nGloves giữ cả /v/ và /z/ cuối, không đổi thành p.\n\n4. The bathroom is over there.\nNhà vệ sinh ở đằng kia.\nGần đúng: đơ baa-th-ruum iz ôu-vơ đe-a.\nÂm /θ/ trong bathroom đặt lưỡi nhẹ giữa răng, thổi hơi không rung giọng.\n\n5. Please put the trash here.\nĐể rác ở đây giúp nhé.\nGần đúng: pliiz put đơ træsh hi-a.\nTrash /træʃ/: âm giữa mở miệng rộng; âm cuối là “sh”, không phải s thường.\n\nNguồn phát âm Cambridge, có nút nghe mẫu:\nhttps://dictionary.cambridge.org/pronunciation/english/here\nhttps://dictionary.cambridge.org/pronunciation/english/there\nhttps://dictionary.cambridge.org/pronunciation/english/where\nhttps://dictionary.cambridge.org/pronunciation/english/glove\nhttps://dictionary.cambridge.org/pronunciation/english/trash\nhttps://dictionary.cambridge.org/pronunciation/english/please\n\nCâu mẫu được đặt theo tình huống công việc để Chu luyện dùng từ."]}, {"date": "2026-11-06", "label": "6/11/2026", "title": "Màu sắc", "parts": ["🀄 TIẾNG TRUNG\n\nTừ mới:\n\n1. 红 hóng (2) - màu đỏ\nÂm bồi: \"hống\" (giọng đi lên).\n\n2. 黄 huáng (2) - màu vàng\nÂm bồi: \"hoáng\" (giọng đi lên).\n\n3. 蓝 lán (2) - màu xanh dương\nÂm bồi: \"lan\" (giọng đi lên).\n\n4. 白 bái (2) - màu trắng\nÂm bồi: \"bái\" (giọng đi lên).\n\n5. 黑 hēi (1) - màu đen\nÂm bồi: \"khây\" (giọng cao ngang, đều đều).\n\nMẹo nhỏ: thêm 色 sè (4) sau tên màu là thành \"màu...\": hóngsè = màu đỏ, báisè = màu trắng. 色 đọc \"sơ\" giọng rơi.\n\nCâu:\n1. 拖把是蓝色的。Tuōbǎ shì lánsè de. - Cây lau nhà màu xanh dương.\n\"tuo-bả sừ lan-sơ dơ\" - 是 shì đọc \"sừ\" giọng rơi (sh cong lưỡi xát); de đọc nhẹ.\n2. 我需要红色的手套。Wǒ xūyào hóngsè de shǒutào. - Tớ cần găng tay màu đỏ.\n\"uổ(trầm) sư-yao hống-sơ dơ sổu(trầm) tao\" - xū: lưỡi như i, môi tròn như u.\n3. 黄色的杯子在哪里？Huángsè de bēizi zài nǎlǐ? - Cái cốc màu vàng ở đâu?\n\"hoáng-sơ dơ bây-dzự chai ná-lỉ?\" - 哪里 đọc tự nhiên ná lỉ (hai thanh 3).\n4. 这个窗户是白色的。Zhège chuānghu shì báisè de. - Cái cửa sổ này màu trắng.\n\"chờ-gơ chuang-hu sừ bái-sơ dơ\" - ge và hu đọc nhẹ.\n5. 这是黑色的吗？Zhè shì hēisè de ma? - Cái này màu đen phải không?\n\"chờ sừ khây-sơ dơ ma?\" - ma đọc nhẹ, giọng hỏi.\n\nMẹo: Cấu trúc \"cái gì + 是 + màu + 色 + 的\" tả màu mọi đồ vật: 手套是红色的。(Găng tay màu đỏ.) Bốn trong năm màu hôm nay đều thanh 2 - cơ hội tốt luyện giọng đi lên.\n\n🇬🇧 TIẾNG ANH\n\nTừ mới:\n1. red /red/ - màu đỏ. \"rét\" - nhưng âm cuối là d (rung thanh, lưỡi chạm nướu), không bật thành t.\n2. yellow /ˈjeləʊ/ - màu vàng. \"dé-lâu\".\n3. blue /bluː/ - màu xanh dương. \"bờ-lu\" (u dài).\n4. white /waɪt/ - màu trắng. \"quai(t nhẹ)\".\n5. black /blæk/ - màu đen. \"bờ-léc(k nhẹ)\" - e mở rộng miệng.\n\nCâu:\n1. The mop is blue. /ðə mɒp ɪz bluː/ - Cây lau nhà màu xanh dương.\n\"đơ móp iz(z nhẹ) bờ-lu\" - is kết bằng z rung.\n2. I need the red gloves. /aɪ niːd ðə red ɡlʌvz/ - Tớ cần đôi găng tay đỏ.\n\"ai ni(i dài, d nhẹ) đơ rét(d) glấp(vz nhẹ)\" - need và red đều kết bằng d rung, không phải t.\n3. Where is the yellow cup? /weə ɪz ðə ˈjeləʊ kʌp/ - Cái cốc màu vàng ở đâu?\n\"que-a iz(z nhẹ) đơ dé-lâu cấp\"\n4. This window is white. /ðɪs ˈwɪndəʊ ɪz waɪt/ - Cửa sổ này màu trắng.\n\"đít(s) win-đâu iz(z nhẹ) quai(t nhẹ)\" - this: th rung (đầu lưỡi kẹp răng).\n5. Please use the black cloth. /pliːz juːz ðə blæk klɒθ/ - Bạn dùng khăn màu đen giúp.\n\"pli-z(z nhẹ) diu-z(z rung) đơ bờ-léc(k nhẹ) cờ-lót(th kẹp răng, không rung)\" - use làm động từ kết bằng z, giống bài excuse.\n\nMẹo: Nói màu của đồ vật chỉ cần \"The + đồ vật + is + màu\": The bucket is red. Nhớ use (động từ) đuôi /z/ - cặp này giống hệt excuse đã học.\n\nNguồn:\n- 紅 hóng: https://en.wiktionary.org/wiki/紅\n- 黃 huáng: https://en.wiktionary.org/wiki/黃\n- 藍 lán: https://en.wiktionary.org/wiki/藍\n- 白 bái: https://en.wiktionary.org/wiki/白\n- 黑 hēi: https://en.wiktionary.org/wiki/黑\n- 色 sè: https://en.wiktionary.org/wiki/色\n- 是 shì: https://en.wiktionary.org/wiki/是\n- 這 zhè: https://en.wiktionary.org/wiki/這\n- Quy tắc hai thanh 3 (哪里): https://chinesefor.us/lessons/mandarin-three-third-tones-change-sandhi/\n- red /red/: https://dictionary.cambridge.org/pronunciation/english/red\n- yellow /ˈjeləʊ/: https://dictionary.cambridge.org/pronunciation/english/yellow\n- blue /bluː/: https://dictionary.cambridge.org/pronunciation/english/blue\n- white /waɪt/: https://dictionary.cambridge.org/pronunciation/english/white\n- black /blæk/: https://dictionary.cambridge.org/pronunciation/english/black\n- this /ðɪs/: https://dictionary.cambridge.org/pronunciation/english/this\n- window /ˈwɪndəʊ/: https://dictionary.cambridge.org/pronunciation/english/window\n- cup /kʌp/: https://dictionary.cambridge.org/pronunciation/english/cup\n- use (v) /juːz/: https://dictionary.cambridge.org/pronunciation/english/use\n- cloth /klɒθ/: https://dictionary.cambridge.org/pronunciation/english/cloth\n- mop /mɒp/: https://dictionary.cambridge.org/pronunciation/english/mop\n- is /ɪz/: https://dictionary.cambridge.org/pronunciation/english/is\n- glove /ɡlʌv/: https://dictionary.cambridge.org/pronunciation/english/glove"]}, {"date": "2026-11-09", "label": "9/11/2026", "title": "Quần áo", "parts": ["Bài sáng 9/11 của Chu: Quần áo.\n\nTIẾNG TRUNG\nCách đọc tiếng Việt chỉ gần đúng; dấu thanh trong phiên âm là mốc chính nhé.\n\n5 từ mới:\n1. 衬衫 · chènshān · áo sơ mi\nĐọc gần: chận-san. Âm chèn xuống giọng, shān cao ngang đều.\n2. 裤子 · kùzi · quần dài\nĐọc gần: khu-dzự; âm kù xuống giọng, zi đọc nhẹ.\n3. 裙子 · qúnzi · váy\nĐọc gần: chün-dzự. Âm giữa là ü: lưỡi như chữ i, môi tròn như chữ u, dù viết bằng u sau q. Giọng đi lên.\n4. 鞋 · xié · giày\nĐọc gần: siế, giọng đi lên.\n5. 袜子 · wàzi · tất, vớ\nĐọc gần: ua-dzự; âm wà xuống giọng, zi nhẹ.\n\n5 câu thường dùng:\n1. 这件衬衫很干净。\nZhè jiàn chènshān hěn gānjìng.\nCái áo sơ mi này sạch rồi.\nGần đúng: chờ chiên chận-san hển gan-ching. Âm hěn (thanh 3) trước âm thanh 1 chỉ đọc trầm.\n\n2. 裤子在哪里？\nKùzi zài nǎlǐ?\nQuần ở đâu?\nGần đúng: khu-dzự chai ná-lỉ? Âm 哪里 đọc tự nhiên ná lỉ vì hai thanh 3 liền nhau.\n\n3. 我需要熨这件衬衫。\nWǒ xūyào yùn zhè jiàn chènshān.\nTớ cần ủi cái áo sơ mi này.\nGần đúng: uổ sư-yao uyn chờ chiên chận-san. Âm wǒ (thanh 3) trước xū (thanh 1) chỉ đọc trầm; 熨 yùn cũng có âm ü tròn môi.\n\n4. 请洗这双袜子。\nQǐng xǐ zhè shuāng wàzi.\nBạn giặt đôi tất này giúp.\nGần đúng: chíng sỉ chờ suang ua-dzự. Âm qǐng xǐ đọc tự nhiên qíng xǉ (hai thanh 3); 双 shuāng nghĩa là đôi.\n\n5. 裙子需要熨吗？\nQúnzi xūyào yùn ma?\nVáy có cần ủi không?\nGần đúng: chün-dzự sư-yao uyn ma?\n\nNhớ nhanh: ba âm ü hôm nay (qún, xū, yùn) đều viết bằng u sau q/x nhưng đọc tròn môi như u, lưỡi như i.\n\nNguồn từ và phát âm:\nhttps://en.wiktionary.org/wiki/襯衫\nhttps://en.wiktionary.org/wiki/褲子\nhttps://en.wiktionary.org/wiki/裙子\nhttps://en.wiktionary.org/wiki/鞋\nhttps://en.wiktionary.org/wiki/襪子\nhttps://en.wiktionary.org/wiki/熨\nQuy tắc hai thanh 3: https://chinesefor.us/lessons/mandarin-three-third-tones-change-sandhi/", "TIẾNG ANH\nPhiên âm theo giọng Anh-Anh. Cách đọc tiếng Việt chỉ giúp nhớ bước đầu, không thay được âm mẫu.\n\n5 từ mới:\n1. shirt /ʃɜːt/ · áo sơ mi\nGần đúng: sớt; âm sh cong lưỡi, ơ kéo dài, t cuối nhẹ.\n2. trousers /ˈtraʊzəz/ · quần dài\nGần đúng: chrâu-zơz. Âm tr nghe như \"chr\"; kết bằng /z/ rung, không phải s.\n3. skirt /skɜːt/ · váy\nGần đúng: skớt. s+k dính liền, không tách thành hai tiếng.\n4. shoes /ʃuːz/ · giày\nGần đúng: su-z; u dài, kết bằng /z/ rung.\n5. socks /sɒks/ · tất, vớ\nGần đúng: sók; o ngắn, kết bằng cụm /ks/ chạm nhẹ.\n\n5 câu thường dùng:\n1. This shirt is clean.\nCái áo sơ mi này sạch rồi.\nGần đúng: đis sớt iz klin. Âm this có th rung (đầu lưỡi đặt nhẹ giữa hai hàm răng); clean: c+l dính liền.\n\n2. Where are the trousers?\nQuần ở đâu?\nGần đúng: ue-a a đơ chrâu-zơz. Are nói nhanh chỉ còn \"a\".\n\n3. I need to iron this shirt.\nTớ cần ủi cái áo này.\nGần đúng: ai ni tơ ai-ơn đis sớt. Iron đọc \"ai-ơn\", không đọc \"ai-ron\".\n\n4. Please wash these socks.\nBạn giặt mấy đôi tất này giúp.\nGần đúng: pli-z uót đi-z sók. Please và these đều kết bằng /z/ rung.\n\n5. The skirt is on the chair.\nCái váy ở trên ghế.\nGần đúng: đơ skớt iz on đơ che-a.\n\nNhớ nhanh: shirt là áo sơ mi, skirt là váy, hai từ nghe gần giống nhau nhưng khác nghĩa. Nhiều từ hôm nay kết bằng /z/ rung (trousers, shoes, these), đừng đọc thành s.\n\nNguồn phát âm Cambridge, có nút nghe mẫu:\nhttps://dictionary.cambridge.org/pronunciation/english/shirt\nhttps://dictionary.cambridge.org/pronunciation/english/trousers\nhttps://dictionary.cambridge.org/pronunciation/english/skirt\nhttps://dictionary.cambridge.org/pronunciation/english/shoe\nhttps://dictionary.cambridge.org/pronunciation/english/sock\nhttps://dictionary.cambridge.org/pronunciation/english/iron\nhttps://dictionary.cambridge.org/pronunciation/english/these\n\nCâu mẫu được đặt theo tình huống công việc giặt ủi để Chu luyện dùng từ."]}, {"date": "2026-11-10", "label": "10/11/2026", "title": "Số đếm", "parts": ["📚 Bài sáng nay (10/11) - chủ đề SỐ ĐẾM\n\n🀄 TIẾNG TRUNG\n\nTừ mới:\n\n1. 一 yī (1) - một\nÂm bồi: \"i\" (cao ngang). Lưu ý: 一 đứng một mình hoặc đếm số thì đọc yī; trước chữ thanh 4 đọc yí (đi lên); trước các thanh khác đọc yì (giọng rơi).\n\n2. 二 èr (4) - hai\nÂm bồi: \"ơ\" giọng rơi - lưỡi cong nhẹ, kéo dài \"ơ\" rồi hạ xuống, không rung đầu lưỡi.\n\n3. 三 sān (1) - ba\nÂm bồi: \"san\" cao ngang. s thường (răng gần nhau), khác sh cong lưỡi.\n\n4. 四 sì (4) - bốn\nÂm bồi: \"sừ\" giọng rơi. i sau s nghe gần \"ư\" ngắn.\n\n5. 五 wǔ (3) - năm\nÂm bồi: \"ủ\" (thanh 3: xuống thấp rồi lên).\n\nCâu:\n1. 我要三杯水。Wǒ yào sān bēi shuǐ. - Tớ muốn ba cốc nước.\n\"uổ(trầm) yao san bây suỷ\" - 要 yào (muốn) giọng rơi; wǒ trước yào (thanh 4) chỉ đọc phần trầm; shuǐ cuối câu đọc đủ thanh 3.\n2. 桌子上有两个杯子。Zhuōzi shang yǒu liǎng ge bēizi. - Trên bàn có hai cái cốc.\n\"chuô-dzự sang(nhẹ) yóu liảng gơ bây-dzự\" - yǒu liǎng là hai thanh 3 liền nên đọc tự nhiên yóu liǎng; 两 liǎng = hai (dùng trước đồ vật), 有 yǒu = có.\n3. 现在五点。Xiànzài wǔ diǎn. - Bây giờ năm giờ.\n\"siên-chai wú điển\" - wǔ diǎn cũng là hai thanh 3 liền nên đọc tự nhiên wú diǎn.\n4. 他有四双袜子。Tā yǒu sì shuāng wàzi. - Anh ấy có bốn đôi tất.\n\"ta yổu(trầm) sừ suang ua-dzự\" - 他 tā = anh ấy; yǒu trước sì (thanh 4) chỉ đọc phần trầm.\n5. 一双鞋多少钱？Yì shuāng xié duōshao qián? - Một đôi giày bao nhiêu tiền?\n\"i suang siế đuo-sao chiến?\" - 一 trước shuāng (thanh 1) đọc yì (giọng rơi); 多少 duōshao = bao nhiêu, 钱 qián = tiền.\n\nMẹo: Đếm đồ vật = số + lượng từ + đồ vật: 三杯水 (ba cốc nước), 四双袜子 (bốn đôi tất). Nói \"hai cái gì đó\" dùng 两 liǎng chứ không dùng 二. Hỏi giá cứ nói: ...多少钱？\n\n🇬🇧 TIẾNG ANH\n\nTừ mới:\n1. one /wʌn/ - một. \"uân\" - bắt đầu bằng u tròn môi, không đọc \"ôn\".\n2. two /tuː/ - hai. \"tu\" (u dài).\n3. three /θriː/ - ba. \"thri\" - th kẹp răng, không rung, hơi thoát ra; rồi \"ri\" i dài.\n4. four /fɔː/ - bốn. \"fo\" (o dài; giọng Anh-Anh không đọc r cuối).\n5. five /faɪv/ - năm. \"fai-v(v nhẹ)\" - kết bằng v (môi dưới chạm răng trên, rung).\n\nCâu:\n1. I need three cups of water. /aɪ niːd θriː kʌps əv ˈwɔːtə/ - Tớ cần ba cốc nước.\n\"ai ni(i dài, d nhẹ) thri cấp(s nhẹ) ơ uo-tơ\" - of nói nhanh chỉ là \"ơ\".\n2. There are two mops. /ðeər ə tuː mɒps/ - Có hai cây lau nhà.\n\"đe-a a tu móp(s nhẹ)\" - there are nói nhanh \"đe-a a\".\n3. It is five o'clock. /ɪt ɪz faɪv əˈklɒk/ - Năm giờ rồi.\n\"it iz(z nhẹ) fai-v(v nhẹ) ơ-klók(k nhẹ)\"\n4. These four socks are clean. /ðiːz fɔː sɒks ə kliːn/ - Bốn chiếc tất này sạch rồi.\n\"đi-z(z nhẹ) fo sók(s nhẹ) a klin\"\n5. How much is this? /haʊ mʌtʃ ɪz ðɪs/ - Cái này bao nhiêu tiền?\n\"hao mấch(ch nhẹ) iz(z nhẹ) đis?\"\n\nMẹo: \"How much is this?\" là câu hỏi giá vạn năng - chỉ vào món đồ rồi hỏi. Nhớ one đọc \"uân\" chứ không phải \"ôn\" - chữ viết và cách đọc của one lệch nhau.\n\nNguồn: Wiktionary (一, 二, 三, 四, 五, 要, 有, 兩, 他, 多少, 錢), chinesefor.us (quy tắc đổi thanh 3), Cambridge Dictionary (phiên âm các từ Anh) - kiểm chứng 10/11/2026."]}, {"date": "2026-11-17", "label": "17/11/2026", "title": "Các phòng trong nhà", "parts": ["*BÀI HỌC SÁNG 17/11 - CÁC PHÒNG TRONG NHÀ*\n\n🀄 *TIẾNG TRUNG*\n\n*Từ mới:*\n\n1. 房间 fángjiān (2-1) - căn phòng\nÂm bồi: \"phang chien\" - fáng thanh 2 giọng đi lên, jiān cao ngang; f = \"ph\".\n\n2. 客厅 kètīng (4-1) - phòng khách\nÂm bồi: \"khơ thing\" - kè giọng rơi, k bật hơi như \"kh\"; tīng cao ngang, t bật hơi như \"th\" trong \"tha\".\n\n3. 卧室 wòshì (4-4) - phòng ngủ\nÂm bồi: \"uo sư\" - cả hai giọng rơi; sh cong đầu lưỡi, i sau sh nghe gần \"ư\" ngắn.\n\n4. 厨房 chúfáng (2-2) - nhà bếp\nÂm bồi: \"chu phang\" - cả hai thanh 2 giọng đi lên; ch là âm vừa tắc vừa xát, đầu lưỡi cong chạm ngạc cứng rồi bật hơi.\n\n5. 卫生间 wèishēngjiān (4-1-1) - nhà vệ sinh\nÂm bồi: \"uây sưng chien\" - wèi giọng rơi; shēng, jiān cao ngang; sh cong đầu lưỡi.\n\n*Câu:*\n\n1. 客厅很干净。Kètīng hěn gānjìng. - Phòng khách sạch sẽ.\n\"khơ thing hển(trầm) kan-ching\" - 很 hěn đứng trước thanh 1 nên chỉ đọc phần trầm của thanh 3. (干净 đã học 6/10)\n\n2. 我在厨房洗杯子。Wǒ zài chúfáng xǐ bēizi. - Tớ rửa cốc trong bếp.\n\"uổ(trầm) chai chu-phang sỉ(trầm) bây-dzự\" - wǒ và xǐ là thanh 3 đứng trước thanh khác nên chỉ đọc phần trầm. (我, 洗, 杯子 đã học)\n\n3. 卧室里有两张床。Wòshì li yǒu liǎng zhāng chuáng. - Trong phòng ngủ có hai cái giường.\n\"uo-sư li(nhẹ) yóu liảng chang chuáng\" - 张 zhāng là lượng từ cho giường, bàn. (两, 床 đã học)\n\n4. 请打扫卫生间。Qǐng dǎsǎo wèishēngjiān. - Làm ơn dọn nhà vệ sinh.\n\"chỉng(trầm) dá-sảo uây-sưng-chien\" - 打扫 hai thanh 3 liền nhau đọc dásǎo. (请, 打扫 đã học)\n\n5. 房间在哪里？Fángjiān zài nǎli? - Căn phòng ở đâu?\n\"phang-chien chai nả(trầm)-li(nhẹ)?\" (哪里 đã học 5/ function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function render(t){
  let h = esc(t);
  h = h.replace(/\*([^*\n]+)\*/g,'<strong>$1</strong>');
  h = h.replace(/_([^_\n]+)_/g,'<em>$1</em>');
  h = h.replace(/(https?:\/\/[^\s<]+)/g,'<a href="$1" target="_blank" rel="noopener">$1</a>');
  return h.split('\n').join('<br>');
}

const main = document.getElementById('lessons');
const nav = document.getElementById('nav');
const sorted = [...LESSONS].sort((a,b)=> b.date.localeCompare(a.date));

sorted.forEach((L,i)=>{
  const id = 'bai-' + L.date;
  const a = document.createElement('a');
  a.href = '#'+id; a.textContent = L.label + ' · ' + L.title;
  nav.appendChild(a);
  const sec = document.createElement('section');
  sec.className = 'lesson'; sec.id = id;
  sec.innerHTML = '<div class="lesson-head"><span class="date">'+L.label+'</span><h2>'+esc(L.title)+'</h2></div>'
    + L.parts.map(p=>'<div class="part">'+render(p)+'</div>').join('');
  main.appendChild(sec);
});
document.getElementById('count').textContent = sorted.length + ' bài học';

function filterLessons(){
  const q = document.getElementById('search').value.trim().toLowerCase();
  let shown = 0;
  document.querySelectorAll('.lesson').forEach(sec=>{
    const hit = !q || sec.textContent.toLowerCase().includes(q);
    sec.style.display = hit ? '' : 'none';
    if(hit) shown++;
  });
  document.getElementById('noresult').style.display = shown ? 'none' : 'block';
}
window.addEventListener('scroll',()=>{
  document.getElementById('top').style.display = window.scrollY > 600 ? 'block' : 'none';
});
